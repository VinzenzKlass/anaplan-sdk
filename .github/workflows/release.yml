name: Release
# Pushing a tag `v<version>` builds, tests and publishes every wheel; the tag must match the
# version in Cargo.toml. Starting the workflow manually builds and tests without publishing.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        # One abi3 wheel per platform covers every Python from 3.12 on. The platforms are the
        # ones gurobipy publishes wheels for.
        platform:
          - { name: linux-x86_64, runner: ubuntu-22.04, target: x86_64, manylinux: auto }
          - { name: linux-aarch64, runner: ubuntu-22.04-arm, target: aarch64, manylinux: auto }
          - { name: windows-x64, runner: windows-latest, target: x64 }
          # Intel and Apple silicon in one wheel, like gurobipy's own macOS wheel.
          - { name: macos-universal2, runner: macos-14, target: universal2-apple-darwin }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build Wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: ${{ matrix.platform.manylinux }}
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Test Wheel
        shell: bash
        # The oldest and newest supported Python, against the installed wheel, not the sources.
        run: |
          for python in 3.12 3.14; do
            uv venv --clear --python "$python" .test-venv
            uv pip install --python .test-venv dist/*.whl pytest hypothesis
            uv run --no-project --python .test-venv python -m pytest tests/
          done
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist/*.whl

  sdist:
    name: Source Distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [ wheels, sdist ]
    runs-on: ubuntu-22.04
    # Must match the environment configured for the trusted publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/polarobi/
    # Job permissions replace the workflow's, so reading the repository is granted again here.
    permissions:
      contents: read
      # Trusted publishing: PyPI accepts this workflow's identity token, no API token needed.
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - name: Check Tag Matches Version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in Cargo.toml."
            exit 1
          fi
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
