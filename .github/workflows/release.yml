name: Release
# Pushing a tag `v<version>` builds and publishes the package; the tag must match the
# version in pyproject.toml. Starting the workflow manually builds without publishing.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.0.0
      - name: Check Tag Matches Version
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          version=$(grep -m1 '^version' pyproject.toml | cut -d '"' -f 2)
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml."
            exit 1
          fi
      - name: Build Wheel and sdist
        run: uv build
      - uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/*

  publish:
    name: Publish to PyPI
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [ build ]
    runs-on: ubuntu-22.04
    # Must match the environment configured for the trusted publisher on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/anaplan-sdk/
    # Job permissions replace the workflow's, so reading the repository is granted again here.
    permissions:
      contents: read
      # Trusted publishing: PyPI accepts this workflow's identity token, no API token needed.
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.0.0
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist
      - name: Publish to PyPI
        run: uv publish

