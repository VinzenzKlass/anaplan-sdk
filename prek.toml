default_language_version.python = "3.14"

repos = [
    {
        repo = "local",
        hooks = [
            { id = "uv-lock", name = "uv lock", entry = "uv lock", language = "system", files = '^(uv\.lock|pyproject\.toml|uv\.toml|requirements\.txt)$', pass_filenames = false, priority = 0 },
            { id = "ruff-format", name = "ruff format", entry = "ruff format --force-exclude", language = "system", types_or = ["python", "pyi", "jupyter"], require_serial = true, priority = 0 },
            { id = "ruff-check", name = "ruff check", entry = "ruff check --force-exclude --fix", language = "system", types_or = ["python", "pyi", "jupyter"], require_serial = true, priority = 1 },
            { id = "basedpyright", name = "basedpyright", entry = "basedpyright --threads 8", language = "system", types_or = ["python", "pyi"], require_serial = true, pass_filenames = false, always_run = true, priority = 0 },
        ]
    }
]
